<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1040" class="architecture-svg" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">연구 성공 후의 VLA Skill Map 최종 아키텍처 제안</title>
<desc id="arch-desc">상위 VLM에서 supervisor, VLA, 로컬 controller와 로봇으로 이어지는 실행 루프. 중앙 Skill Map은 의미, 시간 구간, 실행 계약과 검증 근거를 연결한다. 실행 로그는 불변 LeRobot v3와 sidecar, 반자동 라벨링, 재학습, 독립 평가를 거쳐 버전 묶음으로 배포된다.</desc>
<defs><marker id="arrow-runtime" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24654c"/></marker><marker id="arrow-data" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5486a2"/></marker><marker id="arrow-release" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c46536"/></marker><marker id="arrow-bridge" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24654c"/></marker></defs><style>
text{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;fill:#1c302b} .zone{font-size:15px;font-weight:700;letter-spacing:1px}.zone-sub{font-size:12px;fill:#68756b}.node-title{font-size:16px;font-weight:700}.node-sub{font-size:12px;fill:#53675d}.edge-label{font-size:11px;paint-order:stroke;stroke:#f5f4ed;stroke-width:5px;stroke-linejoin:round}.arch-node{cursor:pointer}.arch-node:focus{outline:none}.arch-node:focus rect,.arch-node.selected rect{stroke-width:3;stroke:#c46536}.arch-part{transition:opacity .18s}.arch-part.dimmed{opacity:.15}
</style><rect width="1160" height="1040" rx="14" fill="#f5f4ed"/>
<text x="30" y="32" class="zone">TARGET ARCHITECTURE / RESEARCH SUCCESS SCENARIO</text><text x="30" y="52" class="zone-sub">설계 제안 · 현재 구현 및 실험 성과를 의미하지 않음</text>
<rect x="20" y="70" width="1120" height="345" rx="12" fill="#e7eee3" stroke="#ccd8c7"/>
<text x="38" y="94" class="zone">01  ONLINE EXECUTION</text><text x="650" y="94" class="zone-sub">상위 reasoning ↔ 현장 supervisor / VLA / controller</text>
<rect x="20" y="650" width="1120" height="355" rx="12" fill="#eaf0f2" stroke="#cad9df"/>
<text x="38" y="674" class="zone">02  ASYNCHRONOUS DATA + LEARNING</text><text x="650" y="674" class="zone-sub">서버 / 학습 인프라 · 온라인 제어와 분리</text><g class="arch-part" data-loop="runtime"><path d="M250 155H295" fill="none" stroke="#24654c" stroke-width="2" marker-end="url(#arrow-runtime)"/></g><g class="arch-part" data-loop="runtime"><path d="M495 155H540" fill="none" stroke="#24654c" stroke-width="2" marker-end="url(#arrow-runtime)"/></g><g class="arch-part" data-loop="runtime"><path d="M740 155H785" fill="none" stroke="#24654c" stroke-width="2" marker-end="url(#arrow-runtime)"/></g><g class="arch-part" data-loop="runtime"><path d="M935 155H970" fill="none" stroke="#24654c" stroke-width="2" marker-end="url(#arrow-runtime)"/></g><g class="arch-part" data-loop="runtime"><path d="M1040 200V238H440V275" fill="none" stroke="#24654c" stroke-width="2" marker-end="url(#arrow-runtime)"/><text x="640" y="233" class="edge-label">sensor / execution evidence</text></g><g class="arch-part" data-loop="runtime"><path d="M595 238V200" fill="none" stroke="#24654c" stroke-width="2" marker-end="url(#arrow-runtime)"/></g><g class="arch-part" data-loop="runtime"><path d="M440 238H220V275" fill="none" stroke="#24654c" stroke-width="2" marker-end="url(#arrow-runtime)"/></g><g class="arch-part" data-loop="runtime"><path d="M395 275V200" fill="none" stroke="#24654c" stroke-width="2" marker-end="url(#arrow-runtime)"/><text x="400" y="260" class="edge-label">verified result</text></g><g class="arch-part" data-loop="runtime"><path d="M150 275V200" fill="none" stroke="#24654c" stroke-width="2" marker-end="url(#arrow-runtime)"/><text x="55" y="252" class="edge-label">state / history</text></g><g class="arch-part" data-loop="runtime"><path d="M295 320H250" fill="none" stroke="#24654c" stroke-width="2" marker-end="url(#arrow-runtime)"/><text x="254" y="340" class="edge-label">결과</text></g><g class="arch-part" data-loop="runtime"><path d="M395 110V103H150V110" fill="none" stroke="#24654c" stroke-width="2" marker-end="url(#arrow-runtime)"/><text x="245" y="99" class="edge-label">skill 경계 / 재계획</text></g><g class="arch-part" data-loop="data"><path d="M705 200V290H770" fill="none" stroke="#5486a2" stroke-width="2" marker-end="url(#arrow-data)" stroke-dasharray="6 5"/><text x="711" y="263" class="edge-label">trace</text></g><g class="arch-part" data-loop="data"><path d="M1040 365V625H195V685" fill="none" stroke="#5486a2" stroke-width="2" marker-end="url(#arrow-data)" stroke-dasharray="6 5"/><text x="625" y="619" class="edge-label">immutable episode + outcome</text></g><g class="arch-part" data-loop="bridge"><path d="M50 515H30V155H50" fill="none" stroke="#24654c" stroke-width="2" marker-end="url(#arrow-bridge)" stroke-dasharray="6 5"/><text x="32" y="441" class="edge-label">skill retrieval</text></g><g class="arch-part" data-loop="bridge"><path d="M395 455V435H265V175H295" fill="none" stroke="#24654c" stroke-width="2" marker-end="url(#arrow-bridge)" stroke-dasharray="6 5"/><text x="273" y="399" class="edge-label">contract lookup</text></g><g class="arch-part" data-loop="bridge"><path d="M640 455V200" fill="none" stroke="#24654c" stroke-width="2" marker-end="url(#arrow-bridge)" stroke-dasharray="6 5"/><text x="647" y="443" class="edge-label">skill condition / executor scope</text></g><g class="arch-part" data-loop="data"><path d="M335 735H395" fill="none" stroke="#5486a2" stroke-width="2" marker-end="url(#arrow-data)"/><text x="339" y="720" class="edge-label">segment</text></g><g class="arch-part" data-loop="data"><path d="M710 735H770" fill="none" stroke="#5486a2" stroke-width="2" marker-end="url(#arrow-data)"/><text x="718" y="720" class="edge-label">labels</text></g><g class="arch-part" data-loop="data"><path d="M550 685V580" fill="none" stroke="#5486a2" stroke-width="2" marker-end="url(#arrow-data)" stroke-dasharray="6 5"/><text x="555" y="603" class="edge-label">validated label revision</text></g><g class="arch-part" data-loop="data"><path d="M940 785V830H225V880" fill="none" stroke="#5486a2" stroke-width="2" marker-end="url(#arrow-data)"/><text x="390" y="824" class="edge-label">frozen candidate + reproducible snapshot</text></g><g class="arch-part" data-loop="release"><path d="M400 925H470" fill="none" stroke="#c46536" stroke-width="2" marker-end="url(#arrow-release)"/><text x="406" y="913" class="edge-label">pass gate</text></g><g class="arch-part" data-loop="release"><path d="M820 925H900" fill="none" stroke="#c46536" stroke-width="2" marker-end="url(#arrow-release)"/><text x="828" y="913" class="edge-label">promote</text></g><g class="arch-part" data-loop="release"><path d="M1110 925H1130V515H1110" fill="none" stroke="#c46536" stroke-width="2" marker-end="url(#arrow-release)" stroke-dasharray="6 5"/><text x="996" y="604" class="edge-label">compatible bundle</text></g><g class="arch-part" data-loop="release"><path d="M1060 455V428H750V178H740" fill="none" stroke="#c46536" stroke-width="2" marker-end="url(#arrow-release)" stroke-dasharray="6 5"/><text x="765" y="401" class="edge-label">activate / rollback</text></g><g class="arch-node arch-part" data-loop="runtime"><title>현재 관측과 실행 이력으로 다음 skill을 선택합니다. skill 경계·예외·목표 변경 때 reasoning을 호출하며, motor frame마다 VLM을 호출하지 않습니다.</title><rect x="50" y="110" width="200" height="90" rx="10" fill="#fffefa" stroke="#24654c" stroke-width="1.4"/><text x="65" y="139" class="node-title">상위 VLM / Agent</text><text x="65" y="163" class="node-sub">목표 분해 · 객체 grounding</text><text x="65" y="184" class="node-sub">skill 검색 · 계획 · 재계획</text></g><g class="arch-node arch-part" data-loop="runtime"><title>skill_id와 arguments를 실행 계약에 대조합니다. 현재 상태·관측 freshness·robot/calibration/action schema·검증된 시작 범위를 확인한 뒤 실행을 허용합니다.</title><rect x="295" y="110" width="200" height="90" rx="10" fill="#fffefa" stroke="#24654c" stroke-width="1.4"/><text x="310" y="139" class="node-title">Skill supervisor</text><text x="310" y="163" class="node-sub">contract · precondition</text><text x="310" y="184" class="node-sub">timeout · 취소 · bounded retry</text></g><g class="arch-node arch-part" data-loop="runtime"><title>단일 공유 VLA를 기본으로 하고, 검증된 경우 skill head·adapter·router를 붙입니다. 의도한 skill과 실제 관측된 skill을 별도로 기록합니다. cluster 하나를 독립 실행 함수로 간주하지 않습니다.</title><rect x="540" y="110" width="200" height="90" rx="10" fill="#fffefa" stroke="#24654c" stroke-width="1.4"/><text x="555" y="139" class="node-title">VLA executor</text><text x="555" y="163" class="node-sub">관측 + target + skill intent</text><text x="555" y="184" class="node-sub">shared policy / adapter / router</text></g><g class="arch-node arch-part" data-loop="runtime"><title>플랫폼의 로컬 controller가 action 단위·workspace·충돌·stale command를 검사합니다. stop/cancel 경로는 상위 VLM 응답과 독립적으로 동작해야 합니다.</title><rect x="785" y="110" width="150" height="90" rx="10" fill="#fffefa" stroke="#24654c" stroke-width="1.4"/><text x="800" y="139" class="node-title">로컬 제어·안전</text><text x="800" y="163" class="node-sub">action 제한</text><text x="800" y="184" class="node-sub">watchdog · stop</text></g><g class="arch-node arch-part" data-loop="runtime"><title>실제 embodiment별 실행 계층입니다. 센서 관측은 VLA·상태 추정·verifier로 전달되며, planner에는 필요한 요약과 관측을 제공합니다.</title><rect x="970" y="110" width="140" height="90" rx="10" fill="#fffefa" stroke="#24654c" stroke-width="1.4"/><text x="985" y="139" class="node-title">Robot / 환경</text><text x="985" y="163" class="node-sub">action 실행</text><text x="985" y="184" class="node-sub">sensor feedback</text></g><g class="arch-node arch-part" data-loop="runtime"><title>센서와 실행 결과를 시간 기준으로 정렬합니다. 온라인 입력은 현재와 과거만 사용합니다. 오프라인 라벨러의 전체 clip·미래 outcome을 온라인 입력으로 전달하지 않습니다.</title><rect x="50" y="275" width="200" height="90" rx="10" fill="#fffefa" stroke="#24654c" stroke-width="1.4"/><text x="65" y="304" class="node-title">상태·작업 메모리</text><text x="65" y="328" class="node-sub">현재 관측 · 실행 이력</text><text x="65" y="349" class="node-sub">object / progress / freshness</text></g><g class="arch-node arch-part" data-loop="runtime"><title>gripper close와 같은 실행 이벤트 대신 실제 postcondition을 판정합니다. failure는 제한된 복구 또는 재계획으로, unknown은 재관측·재검증 또는 controlled stop으로 연결합니다.</title><rect x="295" y="275" width="290" height="90" rx="10" fill="#fffefa" stroke="#24654c" stroke-width="1.4"/><text x="310" y="304" class="node-title">독립 postcondition verifier</text><text x="310" y="328" class="node-sub">success / failure / unknown</text><text x="310" y="349" class="node-sub">진행 · 종료 · 복구 근거</text></g><g class="arch-node arch-part" data-loop="data"><title>episode/frame UID와 inference call/action chunk를 연결합니다. checkpoint·hook·cluster space·router module·denoise step·verifier 버전을 함께 기록해 학습과 분석의 join을 재현합니다.</title><rect x="770" y="275" width="340" height="90" rx="10" fill="#fffefa" stroke="#5486a2" stroke-width="1.4"/><text x="785" y="304" class="node-title">Telemetry / episode recorder</text><text x="785" y="328" class="node-sub">intended skill ≠ observed skill</text><text x="785" y="349" class="node-sub">latent · routing · outcome · intervention</text></g><g class="arch-node arch-part" data-loop="bridge"><title>의미 ID는 checkpoint보다 오래 유지합니다. cluster↔semantic skill은 many-to-many evidence로 저장하고, 실행 계약은 robot별 executor·calibration·valid scope·verifier·평가 근거를 참조합니다. 새 cluster나 이름만으로 새 실행 기능을 등록하지 않습니다.</title><rect x="50" y="455" width="1060" height="125" rx="10" fill="#fffefa" stroke="#24654c" stroke-width="1.4"/><text x="65" y="484" class="node-title">Skill Map / capability registry</text><text x="65" y="508" class="node-sub">O: stable ontology  ·  Z: model-local latent evidence  ·  A: temporal grounding</text><text x="65" y="529" class="node-sub">G: composition + execution contracts  ·  P: provenance + capability evidence</text></g><text x="65" y="560" class="node-sub arch-part" data-loop="bridge">의미 ID ≠ latent cluster ≠ MoE expert · 검증된 embodiment별 executor와 실행 범위 연결</text><g class="arch-node arch-part" data-loop="data"><title>원본 데이터는 보존하고 dataset/episode/frame UID로 sidecar를 연결합니다. split·label release·ontology revision·selection manifest를 고정해 같은 학습 snapshot을 재구성할 수 있게 합니다.</title><rect x="50" y="685" width="285" height="100" rx="10" fill="#fffefa" stroke="#5486a2" stroke-width="1.4"/><text x="65" y="714" class="node-title">불변 LeRobot v3 + sidecar</text><text x="65" y="738" class="node-sub">원본 trajectory / video / metadata</text><text x="65" y="759" class="node-sub">segment · outcome · label revision</text></g><g class="arch-node arch-part" data-loop="data"><title>오프라인에서는 전체 clip을 사용하되 evidence scope를 명시합니다. 고정 teacher와 class별 calibration, 사람 검수, unknown 및 random audit로 선택 편향과 오류 누적을 측정합니다.</title><rect x="395" y="685" width="315" height="100" rx="10" fill="#fffefa" stroke="#5486a2" stroke-width="1.4"/><text x="410" y="714" class="node-title">반자동 annotation engine</text><text x="410" y="738" class="node-sub">운동학 + latent + VLM proposal</text><text x="410" y="759" class="node-sub">active review · gold / random audit</text></g><g class="arch-node arch-part" data-loop="data"><title>검수된 데이터와 가중 pseudo-label을 선택하고 unknown semantic loss를 mask합니다. 실패 action을 그대로 성공 demonstration으로 BC하지 않습니다. Stellar router는 추가 가치가 검증됐을 때 채택합니다.</title><rect x="770" y="685" width="340" height="100" rx="10" fill="#fffefa" stroke="#5486a2" stroke-width="1.4"/><text x="785" y="714" class="node-title">Snapshot selector + training</text><text x="785" y="738" class="node-sub">failure / rare / OOD + replay</text><text x="785" y="759" class="node-sub">skill supervision → adapter → continual</text></g><g class="arch-node arch-part" data-loop="release"><title>학습 후보를 고정 gold와 독립 rollout으로 평가합니다. 기존 skill 회귀·unknown 처리·오호출·실행 지연·검수 효율을 함께 확인합니다. 새 skill 범위와 새 embodiment는 별도 실행 검증이 필요합니다.</title><rect x="50" y="880" width="350" height="90" rx="10" fill="#fffefa" stroke="#c46536" stroke-width="1.4"/><text x="65" y="909" class="node-title">독립 evaluation gate</text><text x="65" y="933" class="node-sub">locked gold · ID/OOD · robot/HIL</text><text x="65" y="954" class="node-sub">성공률 · forgetting · latency · 비용</text></g><g class="arch-node arch-part" data-loop="release"><title>모델·입출력 processor·ontology·contract·verifier·robot config·평가 결과를 하나의 immutable release로 묶습니다. 호환성이 검증된 bundle만 배포 후보가 됩니다.</title><rect x="470" y="880" width="350" height="90" rx="10" fill="#fffefa" stroke="#c46536" stroke-width="1.4"/><text x="485" y="909" class="node-title">버전 일치 release bundle</text><text x="485" y="933" class="node-sub">policy + ontology + contracts</text><text x="485" y="954" class="node-sub">verifier + processor + provenance</text></g><g class="arch-node arch-part" data-loop="release"><title>초기에는 사람이 승격합니다. 장기적으로는 이미 검증된 범위의 update만 제한적으로 자동 승격하고, 회귀 감지 시 이전 bundle로 되돌립니다. 새 기능의 실행 권한은 별도 gate를 거칩니다.</title><rect x="900" y="880" width="210" height="90" rx="10" fill="#fffefa" stroke="#c46536" stroke-width="1.4"/><text x="915" y="909" class="node-title">승격 / rollback</text><text x="915" y="933" class="node-sub">shadow → canary</text><text x="915" y="954" class="node-sub">범위 내 자동화</text></g><text x="38" y="1026" class="zone-sub">실선: 주 흐름   /   점선: 비동기 기록·조회·배포   /   녹색: 실행·계약   /   청색: 데이터·학습   /   주황: 평가·승격</text></svg>